<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Justin Silguero — AI Profile</title>
<style>
  :root {
    --bg: #0b0e14;
    --card: rgba(255, 255, 255, 0.045);
    --card-border: rgba(255, 255, 255, 0.09);
    --text: #e8ecf4;
    --muted: #9aa4b8;
    --accent: #6ea8ff;
    --accent2: #b07cff;
    --glow: rgba(110, 168, 255, 0.25);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(176,124,255,0.12), transparent 60%),
      radial-gradient(1000px 500px at 10% 110%, rgba(110,168,255,0.10), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    line-height: 1.6;
    min-height: 100vh;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 56px 20px 80px; }

  /* Hero */
  .hero { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; margin-bottom: 44px; }
  .avatar {
    width: 128px; height: 128px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 44px; font-weight: 700; color: #fff;
    box-shadow: 0 0 0 3px rgba(255,255,255,0.08), 0 8px 40px var(--glow);
  }
  .hero h1 { font-size: 2.2rem; letter-spacing: -0.02em; }
  .hero .tagline { color: var(--muted); font-size: 1.05rem; margin-top: 4px; }
  .badges { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .badge {
    font-size: 0.78rem; padding: 4px 12px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--card-border); color: var(--muted);
  }

  /* Sections */
  section { margin-bottom: 48px; }
  h2 {
    font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--accent); margin-bottom: 16px;
  }

  /* Account cards */
  .accounts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  a.account {
    display: flex; align-items: center; gap: 14px; text-decoration: none;
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 16px; padding: 16px 18px; color: var(--text);
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  a.account:hover {
    transform: translateY(-2px); border-color: rgba(110,168,255,0.45);
    box-shadow: 0 6px 24px var(--glow);
  }
  .account svg { width: 28px; height: 28px; flex-shrink: 0; }
  .account .name { font-weight: 600; }
  .account .handle { font-size: 0.82rem; color: var(--muted); }

  /* Accomplishment cards */
  .items { display: flex; flex-direction: column; gap: 14px; }
  .item {
    background: var(--card); border: 1px solid var(--card-border);
    border-left: 3px solid var(--accent);
    border-radius: 14px; padding: 18px 20px;
  }
  .item h3 { font-size: 1.02rem; margin-bottom: 4px; }
  .item .meta { font-size: 0.8rem; color: var(--accent2); margin-bottom: 8px; }
  .item p { color: var(--muted); font-size: 0.94rem; }

  /* Skills */
  .skills { display: flex; flex-wrap: wrap; gap: 10px; }
  .skill {
    padding: 7px 16px; border-radius: 999px; font-size: 0.86rem;
    background: var(--card); border: 1px solid var(--card-border);
  }

  footer { color: var(--muted); font-size: 0.8rem; text-align: center; margin-top: 60px; }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
